<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя доска</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>Моя доска</h1>
    <button class="theme-btn" id="themeBtn">Тёмная тема</button>
</header>

<main class="main-content">
    <div class="board">
        <section class="column" data-status="ideas">
            <div class="column-head">
                <h2>Идеи</h2>
                <span class="count">0</span>
            </div>
            <div class="cards" id="ideas"></div>
            <button class="add-btn" data-add="ideas">+ Добавить</button>
        </section>

        <section class="column" data-status="todo">
            <div class="column-head">
                <h2>Нужно сделать</h2>
                <span class="count">0</span>
            </div>
            <div class="cards" id="todo"></div>
            <button class="add-btn" data-add="todo">+ Добавить</button>
        </section>

        <section class="column" data-status="doing">
            <div class="column-head">
                <h2>В процессе</h2>
                <span class="count">0</span>
            </div>
            <div class="cards" id="doing"></div>
            <button class="add-btn" data-add="doing">+ Добавить</button>
        </section>

        <section class="column" data-status="done">
            <div class="column-head">
                <h2>Готово</h2>
                <span class="count">0</span>
            </div>
            <div class="cards" id="done"></div>
            <button class="add-btn" data-add="done">+ Добавить</button>
        </section>
    </div>
</main>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        <span class="nav-text">Доска</span>
    </a>
    <a href="stats.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span class="nav-text">Статистика</span>
    </a>
    <a href="profile.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="nav-text">Профиль</span>
    </a>
</nav>

<div class="modal hidden" id="modal">
    <div class="modal-box">
        <h3 id="modalTitle">Новая задача</h3>
        <input type="text" id="taskInput" placeholder="Что нужно сделать?">
        <div class="modal-buttons">
            <button class="btn-cancel" id="cancelBtn">Отмена</button>
            <button class="btn-save" id="saveBtn">Сохранить</button>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('myBoardTheme') === 'dark') {
        document.body.classList.add('dark');
    }
</script>
<script src="app.js"></script>
</body>
</html>
