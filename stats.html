<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика — Моя доска</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stats.css">
</head>
<body>

<header class="header">
    <h1>Статистика</h1>
</header>

<main class="main-content">
    <div class="page-container">

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="statTotal">0</span>
                <span class="stat-label">Всего задач</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statDone">0</span>
                <span class="stat-label">Выполнено</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statProgress">0%</span>
                <span class="stat-label">Прогресс</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

    </div>
</main>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        <span class="nav-text">Доска</span>
    </a>
    <a href="stats.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span class="nav-text">Статистика</span>
    </a>
    <a href="profile.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="nav-text">Профиль</span>
    </a>
</nav>

<script>
    if (localStorage.getItem('myBoardTheme') === 'dark') {
        document.body.classList.add('dark');
    }
</script>
<script src="stats.js"></script>
</body>
</html>
